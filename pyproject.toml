[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowguard"
version = "1.0.0"
description = "Explainable network traffic anomaly detection with a reproducible offline lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scapy>=2.6,<3", "streamlit>=1.49,<2", "plotly>=6,<7", "pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
flowguard = "flowguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
